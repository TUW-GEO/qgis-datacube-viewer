<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>GeoZarr cube axis sliders</title>
  <!-- Same cube as open_cube.svg, but the front face is emptied and carries a
       slider: the dimensions are what you now scrub through. -->
  <g stroke-linejoin="round" stroke-width="1.1">
    <path d="M3 9 9 3H21L15 9Z" fill="#cfe3f7" stroke="#1a4971"/>
    <path d="M15 9 21 3V15L15 21Z" fill="#6aa6d8" stroke="#1a4971"/>
    <rect x="3" y="9" width="12" height="12" fill="#e8f2fb" stroke="#1a4971"/>
  </g>
  <!-- Two slider tracks with knobs at different positions. -->
  <g stroke-linecap="round">
    <path d="M5.5 13H12.5M5.5 17.5H12.5" stroke="#9ec5ea" stroke-width="1.6"/>
    <path d="M5.5 13H9M5.5 17.5H7.5" stroke="#2b6cb0" stroke-width="1.6"/>
  </g>
  <g fill="#1a4971" stroke="#ffffff" stroke-width="0.8">
    <circle cx="9" cy="13" r="1.9"/>
    <circle cx="7.5" cy="17.5" r="1.9"/>
  </g>
</svg>
