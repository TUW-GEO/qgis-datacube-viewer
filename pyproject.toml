[project]
name = "datacube-viewer"
version = "0.0.0"
description = "QGIS plugin and dev tooling for viewing GeoZarr datacubes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Colin Moldenhauer", email = "colin.moldenhauer@geo.tuwien.ac.at" }]
keywords = ["zarr", "geozarr", "geospatial", "qgis", "raster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "zarr>=3.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Extras needed only by scripts/make_dummy_data.py --source copernicus
dem = [
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[project.urls]
Homepage = "https://github.com/TUW-GEO/qgis-datacube-viewer"
Repository = "https://github.com/TUW-GEO/qgis-datacube-viewer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.uv]
# Dev tooling for scripts/ and tests/, not an installable package; the plugin
# (plugin/) ships on its own.
package = false

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "BLE",      # blind except
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
# scripts/ is on sys.path in tests, not an installed package.
known-first-party = ["make_dummy_data"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
