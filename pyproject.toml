[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-zarr"
dynamic = ["version"]
description = "Tooling for inspecting and visualizing GeoZarr stores"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Colin Moldenhauer", email = "colin.moldenhauer@geo.tuwien.ac.at" }]
keywords = ["zarr", "geozarr", "geospatial", "qgis", "raster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "zarr>=3.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Extras needed only by scripts/make_dummy_geozarr.py --source copernicus
dem = [
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[project.scripts]
geozarr = "geozarr.cli:main"

[project.urls]
Homepage = "https://github.com/TUW-GEO/qgis-datacube-viewer"
Repository = "https://github.com/TUW-GEO/qgis-datacube-viewer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.hatch.version]
path = "src/geozarr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geozarr"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "BLE",      # blind except
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
# scripts/ is on sys.path in tests, not an installed package.
known-first-party = ["geozarr", "make_dummy_geozarr"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
# Only the library is type-checked; scripts/ are standalone and exploratory
# (ruff still lints them).
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["geozarr"]
branch = true
