[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "qgis-datacube-viewer"
# From the git tag, like the plugin zip: v0.2.0 builds 0.2.0. See [tool.hatch.version].
dynamic = ["version"]
description = "QGIS raster provider for Icechunk, Zarr and NetCDF datacubes, as a plugin and a Python package"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Colin Moldenhauer", email = "colin.moldenhauer@geo.tuwien.ac.at" }]
# tags= from datacube_viewer/metadata.txt, same order, plus the last two. Keep in step.
keywords = [
    "geozarr",
    "zarr",
    "netcdf",
    "datacube",
    "icechunk",
    "raster",
    "multiscale",
    "pyramid",
    "cog",
    "earth observation",
    "geospatial",
    "qgis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    # CF grid mappings resolve through pyproj (core/crs.py). Every QGIS build ships
    # it, so installing into QGIS's Python leaves the bundled copy alone.
    "pyproj>=3.6",
]

[project.optional-dependencies]
# One extra per row of the plugin's Install Python Dependencies dialog
# (FORMAT_CHOICES in datacube_viewer/core/environment.py), so pip and the dialog never
# disagree about what opens what. tests/test_environment.py keeps them in step.
zarr = ["zarr>=3"]
netcdf = ["netCDF4>=1.7"]
# Both are useless without zarr, so asking for either brings it (NEEDS_ZARR).
icechunk = ["qgis-datacube-viewer[zarr]", "icechunk>=1.0"]
# Plain Zarr on s3://. As in the dialog, gs:// and az:// want gcsfs and adlfs in
# place of s3fs, which are left to the user.
remote = ["qgis-datacube-viewer[zarr]", "fsspec>=2023.10", "s3fs"]
all = ["qgis-datacube-viewer[zarr,netcdf,icechunk,remote]"]

[project.urls]
Homepage = "https://github.com/TUW-GEO/qgis-datacube-viewer"
Repository = "https://github.com/TUW-GEO/qgis-datacube-viewer"

# How qgis-project finds the raster provider when a layer asks for it by key: the name
# is the provider key, the value registers the provider with QGIS.
# tests/test_packaging.py keeps the name equal to PROVIDER_KEY.
[project.entry-points."qgis_project.providers"]
datacube_viewer = "datacube_viewer.provider:register_provider"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout",
    # The plugin suite reads real Icechunk and NetCDF stores. Tests that need QGIS
    # skip themselves here; `pixi run test` runs them against a real QGIS.
    "icechunk>=1.0",
    "netCDF4>=1.7",
    "ruff>=0.6",
    "pre-commit>=3.8",
    { include-group = "data" },
]
# Generating test data: scripts/make_dummy_data.py (--source copernicus reads a GeoTIFF)
# run in the project environment. The script also declares these inline (PEP 723) for
# `uv run --script`.
data = [
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Only v* tags are releases, as in scripts/build_plugin.py. Left to its default,
# setuptools-scm would also take plugin-upstream-0.2.1 for version 0.2.1.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
# The plugin directory is also the Python package: the wheel and the Plugin Manager's
# zip (scripts/build_plugin.py) ship the same datacube_viewer/. It stays at the repo
# root rather than under src/, where deploy_dev.py and the plugin tooling expect it.
packages = ["datacube_viewer"]

[tool.hatch.build.targets.sdist]
include = ["/datacube_viewer"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
# The plugin runs inside QGIS, and QGIS 3.34 on some distros still ships Python 3.9.
# The standalone scripts under scripts/ are PEP 723 and need 3.12, but they use no
# syntax newer than 3.9 that ruff would reject.
target-version = "py39"
exclude = ["build", ".pixi", "*.pyc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Qt overrides are camelCase by contract, and `l`/`I` are not used as names here.
    "N802",
    # Long lines inside docstrings and WKT literals carry meaning; the formatter
    # handles code width and E501 would only force ugly wrapping of prose.
    "E501",
    # `except Exception` is deliberate anywhere a Python exception would cross into
    # a C++ virtual call, which is a crash rather than a traceback.
    "BLE001",
    # En dashes, x and arrows are intentional in user-facing strings and prose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes on purpose: the dialog's widgets are its
# interface for testing, and exposing them publicly would be worse.
"tests/*" = ["SLF001", "B011"]
# Import-after-setenv is required: QT_QPA_PLATFORM must be set before qgis loads.
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
# scripts/ is on sys.path in tests, not an installed package.
known-first-party = ["datacube_viewer", "make_dummy_data", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning:zarr.*",
    "ignore:.*UnstableSpecificationWarning.*",
]
timeout = 300
