# CI for datacube-viewer: lint and test the library, and package the QGIS plugin.

stages: [lint, test, build, release]

default:
  image: python:3.12-slim
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: .cache/uv
  UV_LINK_MODE: copy

.uv:
  before_script:
    - pip install --quiet --root-user-action=ignore uv
    - uv sync --all-extras --group dev

lint:
  stage: lint
  extends: .uv
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  extends: .uv
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - uv run pytest --junit-xml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# plugin/scripts/build_plugin.py is standard-library only: it validates
# metadata.txt, builds the archive and re-opens it to assert the single-top-level-
# directory layout QGIS requires. No environment, so this stays a fast check that a
# metadata edit has not made the plugin uninstallable.
#
# The plugin's own pytest suite is not run here: it needs QGIS and pytest-qgis from
# plugin/pixi.toml, and that conda environment takes minutes to solve. Run it with
# `pixi run test` in plugin/.
build:plugin:
  stage: build
  # Tag pipelines are handled by release:plugin, which stamps the real version; two
  # archives differing only in version number would be a trap.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    # No git in python:3.12-slim, so `git describe` cannot run -- the sha is passed
    # in instead, which keeps an untagged artifact traceable without it ever looking
    # like a release.
    - python plugin/scripts/build_plugin.py --version "0.0.0+$CI_COMMIT_SHORT_SHA"
    - ls -lh plugin/build
  artifacts:
    name: "datacube_viewer-$CI_COMMIT_REF_SLUG"
    paths: [plugin/build/*.zip]
    expire_in: 4 weeks

# --------------------------------------------------------------------------- #
# Tagged plugin releases
#
# The git tag is the single source of truth for the version: tag v0.0.1 ships as
# 0.0.1. plugin/datacube_viewer/metadata.txt holds the placeholder 0.0.0 and
# build_plugin.py injects the real value on the way into the .zip, so the number is
# written down in exactly one place.
#
# Two consequences of that, both handled below:
#   * The working tree never shows the released version, so the build reads the
#     number back out of the finished archive and fails if it disagrees.
#   * GitLab's own variable expansion has no bash parameter expansion, so
#     ${CI_COMMIT_TAG#v} cannot be used in the `release:` keyword. The stripped
#     version is handed to release:create through a dotenv report instead.
#
# `v*` is the plugin's namespace, because the plugin is what this repository
# releases. Give any other releasable component its own prefix.
# --------------------------------------------------------------------------- #
release:plugin:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - export PLUGIN_VERSION="${CI_COMMIT_TAG#v}"
    - echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> release.env
    - python plugin/scripts/build_plugin.py --clean --version "$PLUGIN_VERSION"
    # Uploaded with the standard library, not curl: python:3.12-slim has no curl,
    # no wget and no git. The alternatives were an apt-get on every release or a
    # second job in a second image to make one HTTP request. --as fixes the name in
    # the registry so the release asset URL is predictable; the version is already
    # in the registry path.
    - |
      python plugin/scripts/upload_package.py         --file "plugin/build/datacube_viewer-$PLUGIN_VERSION.zip"         --package datacube_viewer         --version "$PLUGIN_VERSION"         --as datacube_viewer.zip
  artifacts:
    paths: [plugin/build/*.zip]
    expire_in: never
    reports:
      dotenv: release.env

release:create:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: ["release:plugin"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG (version $PLUGIN_VERSION)"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Datacube Viewer QGIS plugin $CI_COMMIT_TAG. Install with Plugins > Manage and Install Plugins > Install from ZIP."
    assets:
      links:
        - name: "datacube_viewer.zip (QGIS plugin)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/datacube_viewer/$PLUGIN_VERSION/datacube_viewer.zip"
